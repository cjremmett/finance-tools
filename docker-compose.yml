services:
  postgresql:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "11001:5432"
    environment:
      POSTGRES_DB: finance_tools
      POSTGRES_USER: finance-tools
      POSTGRES_PASSWORD: finance-tools
    volumes:
      - interest_rate_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance-tools -d finance_tools"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://finance-tools:finance-tools@postgresql:5432/finance_tools
    command: ["alembic", "upgrade", "head"]

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-host.docker.internal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-finance-tools}
      DATABASE_URL: postgresql+psycopg://finance-tools:finance-tools@postgresql:5432/finance_tools
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?Set DISCORD_WEBHOOK_URL in .env}
      FRED_API_KEY: ${FRED_API_KEY:?Set FRED_API_KEY in .env}
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:?Set KALSHI_API_KEY_ID in .env}
      KALSHI_PRIVATE_KEY_BASE64: ${KALSHI_PRIVATE_KEY_BASE64:?Set KALSHI_PRIVATE_KEY_BASE64 in .env}
      KALSHI_CATEGORY_WHITELIST: ${KALSHI_CATEGORY_WHITELIST:?Set KALSHI_CATEGORY_WHITELIST in .env}
      KALSHI_DISCORD_WEBHOOK_URL: ${KALSHI_DISCORD_WEBHOOK_URL:?Set KALSHI_DISCORD_WEBHOOK_URL in .env}
      KALSHI_DISCORD_BATCH_DELAY_SECONDS: ${KALSHI_DISCORD_BATCH_DELAY_SECONDS:-1}
      KALSHI_REQUESTS_PER_SECOND: ${KALSHI_REQUESTS_PER_SECOND:-10}
      KALSHI_EVENT_RESOLUTION_TIMEOUT_SECONDS: ${KALSHI_EVENT_RESOLUTION_TIMEOUT_SECONDS:-60}
      KALSHI_MIN_MARKET_DURATION_DAYS: ${KALSHI_MIN_MARKET_DURATION_DAYS:-0}
      CRYPTO_CARRY_DISCORD_WEBHOOK_URL: ${CRYPTO_CARRY_DISCORD_WEBHOOK_URL:?Set CRYPTO_CARRY_DISCORD_WEBHOOK_URL in .env}
      THETADATA_API_KEY: ${THETADATA_API_KEY:?Set THETADATA_API_KEY in .env}
      ETL_PIPELINE_DISCORD_WEBHOOK: ${ETL_PIPELINE_DISCORD_WEBHOOK:?Set ETL_PIPELINE_DISCORD_WEBHOOK in .env}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?Set GARAGE_ACCESS_KEY_ID in .env}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Set GARAGE_SECRET_ACCESS_KEY in .env}
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT:-http://host.docker.internal:3900}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      QUACK_URI: ${QUACK_URI:-quack:host.docker.internal:9494}
      QUACK_TOKEN: ${QUACK_TOKEN:?Set QUACK_TOKEN in .env}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://192.168.0.20:8181/catalog}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      REDIS_URL: redis://redis:6379/0
      THETADATA_MAX_CONCURRENT: ${THETADATA_MAX_CONCURRENT:-2}
      THETADATA_REQUESTS_PER_MINUTE: ${THETADATA_REQUESTS_PER_MINUTE:-0}
      THETADATA_LEASE_SECONDS: ${THETADATA_LEASE_SECONDS:-900}
      THETADATA_JOB_PRIORITIES: ${THETADATA_JOB_PRIORITIES:-ThetaDataOptionDataWorkflow=10,ThetaDataSecuritiesWorkflow=20,ThetaDataOptionBackfillWorkflow=100}
      THETADATA_OPTION_BATCH_SIZE: ${THETADATA_OPTION_BATCH_SIZE:-40}
      THETADATA_OPTION_MIN_ROWS: ${THETADATA_OPTION_MIN_ROWS:-1000}

volumes:
  interest_rate_postgres_data:
