[project]
name = "finance-tools"
version = "0.1.0"
description = "Temporal-powered interest rate monitoring tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.13,<5",
    "cryptography>=45,<47",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "temporalio>=1.15,<2",
]

[project.scripts]
finance-tools-worker = "finance_tools.worker:main"
interest-rate-worker = "interest_rates_scraper.worker:main"
kalshi-market-worker = "kalshi_markets.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_tools", "interest_rates_scraper", "kalshi_markets"]
exclude = ["kalshi_markets/kalshi-api-key*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
